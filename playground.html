<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playground - Complete intro to Vue 3</title>
  </head>
  <body>
    <h1>Hello Frontend Masters!</h1>
    <div id="app">
      <h1>Counter</h1>
      <p>{{ count }}</p>
      <button v-on:Click="incrementCount">Increment Count</button>
      <div>
        <label for="incrementAmount">Increment by:</label>
        <input type="number" v-bind:value="incrementAmount" />
      </div>
      <hr />
      <p v-if="message.length === 0">Even: {{ message.toUpperCase() }}</p>
      <p v-else>Odd: {{ message }}</p>
        <ul v-for="item in listOfNumbers"> 
          <li>
            {{ item.id }}</li>
            <ul>
              <li v-for="number in item.list">{{ number }} </li>
            </ul>
          </li>
      </ul>
    </div>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
      const { createApp } = Vue
      let count = 0
      function increment() {
        count++
      }
      const app = createApp({
        data () {
          return {
            count: 10,
            incrementAmount: 10,
            message: 'Hello it works',
            listOfNumbers: [
              {
                name: 1,
                id: '1444432432',
                list: [1, 2, 3]
              },
              {
                name: 2,
                id: '1444432432',
                list: [1, 2, 3]
              },
              {
                name: 3,
                id: '1444432432',
                list: [1, 2, 3]
              },
              {
                name: 4,
                id: '1444432432',
                list: [1, 2, 3]
              }
            ]
 
          }
        },
          methods: {
            incrementCount() {
              this.count += this.incrementAmount
            }
          }
      })

      app.mount('#app')

    </script>
  </body>
</html>
